<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terraria Boss Guide</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1f2937">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen pb-10">

  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-10 px-4 py-4 shadow-lg">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <h1 class="text-2xl font-bold text-green-400 flex items-center gap-2">
        🌳 Terraria Boss Guide
      </h1>
      <button id="installBtn" class="hidden bg-green-600 hover:bg-green-500 text-white font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2">
        📲 Save to Home Screen
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 mt-6">
    <!-- Search & Filters -->
    <div class="flex flex-col md:flex-row gap-4 mb-6">
      <input type="text" id="searchInput" placeholder="Search boss, biome, or summon item..." 
             class="flex-1 bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:border-green-500">
      
      <select id="stageFilter" class="bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:border-green-500">
        <option value="all">All Categories</option>
        <option value="Pre-Hardmode">Pre-Hardmode</option>
        <option value="Hardmode">Hardmode</option>
        <option value="Event Boss">Event Bosses</option>
      </select>
    </div>

    <!-- Boss List -->
    <div id="bossList" class="flex flex-col gap-3"></div>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.remove('hidden');
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.classList.add('hidden');
      }
      deferredPrompt = null;
    });

    // Fandom Wiki dynamic image locator
    const getFandomImg = (filename) => `https://terraria.fandom.com/wiki/Special:FilePath/${filename}`;

    const bosses = [
      // --- PRE-HARDMODE ---
      {
        name: "King Slime",
        stage: "Pre-Hardmode",
        image: getFandomImg("King_Slime.png"),
        biome: "Surface / Forest",
        summon: "Slime Crown (20 Gel + Gold/Platinum Crown at Demon/Crimson Altar) or during Slime Rain event",
        hp: "2,000 (Classic) / 2,800 (Expert) / 3,570 (Master)",
        drops: "Solidifier, Slime Hook, Ninja Gear pieces, Royal Gel (Expert)",
        notes: "Optional introductory boss. Building an elevated platform makes this fight very easy."
      },
      {
        name: "Eye of Cthulhu",
        stage: "Pre-Hardmode",
        image: getFandomImg("Eye_of_Cthulhu.png"),
        biome: "Surface (Night)",
        summon: "Suspicious Looking Eye (6 Lenses at Altar) or 33% chance each night if HP > 200 & 3+ NPCs present",
        hp: "2,800 (Classic) / 3,640 (Expert) / 4,641 (Master)",
        drops: "Demonite / Crimtane Ore, Corrupt / Crimson Seeds, Shield of Cthulhu (Expert)",
        notes: "Transforms into Phase 2 below 50% HP, removing its pupil and charging rapidly."
      },
      {
        name: "Eater of Worlds",
        stage: "Pre-Hardmode",
        image: getFandomImg("Eater_of_Worlds.png"),
        biome: "The Corruption",
        summon: "Worm Food (30 Vile Powder + 15 Rotten Chunk) or breaking 3 Shadow Orbs",
        hp: "10,050 total (Classic) / 15,120 (Expert)",
        drops: "Demonite Ore, Shadow Scale, Worm Scarf (Expert)",
        notes: "A multi-segmented worm. Piercing weapons and area-of-effect attacks work best."
      },
      {
        name: "Brain of Cthulhu",
        stage: "Pre-Hardmode",
        image: getFandomImg("Brain_of_Cthulhu.png"),
        biome: "The Crimson",
        summon: "Bloody Spine (30 Vicious Powder + 15 Vertebrae) or breaking 3 Crimson Hearts",
        hp: "1,250 (Classic) / 2,125 (Expert)",
        drops: "Crimtane Ore, Tissue Sample, Brain of Confusion (Expert)",
        notes: "Phase 1 requires destroying its orbiting Creepers. Phase 2 creates teleporting illusions."
      },
      {
        name: "Queen Bee",
        stage: "Pre-Hardmode",
        image: getFandomImg("Queen_Bee.png"),
        biome: "Underground Jungle",
        summon: "Abeemination (5 Honeycomb + 1 Stinger + 5 Hive + 1 Bottled Honey) or breaking a Larva inside a Bee Hive",
        hp: "3,400 (Classic) / 4,760 (Expert)",
        drops: "Bee Gun, Bee Keeper, Hive Pack (Expert)",
        notes: "Alternates between horizontal charging attacks and spawning small bees."
      },
      {
        name: "Skeletron",
        stage: "Pre-Hardmode",
        image: getFandomImg("Skeletron.png"),
        biome: "Dungeon Entrance",
        summon: "Talk to the Old Man at the Dungeon entrance at Night, or equip Clothier Voodoo Doll",
        hp: "4,400 (Classic) / 8,800 (Expert)",
        drops: "Skeletron Hand, Book of Skulls, Bone Glove (Expert)",
        notes: "Defeating Skeletron grants safe access to the entire Dungeon."
      },
      {
        name: "Deerclops",
        stage: "Pre-Hardmode",
        image: getFandomImg("Deerclops.png"),
        biome: "Snow Biome (Midnight / Blizzard)",
        summon: "Deer Thing (1 Flinx Fur + 5 Demonite/Crimtane Ore + 1 Lens)",
        hp: "7,000 (Classic) / 11,900 (Expert)",
        drops: "Eye Bone, Lucy the Axe, Bone Helm (Expert)",
        notes: "Don't Starve Together crossover boss. Immune to cold hazards."
      },
      {
        name: "Wall of Flesh",

        image: getFandomImg("Wall_of_Flesh.png"),
        biome: "Underworld",
        summon: "Throw a Guide Voodoo Doll into lava in the Underworld while the Guide is alive",
        hp: "8,000 (Classic) / 11,200 (Expert)",
        drops: "Pwnhammer, Class Emblem, Demon Heart (Expert)",
        notes: "Defeating this boss permanently transitions your world into Hardmode."
      },

      // --- HARDMODE ---
      {
        name: "Queen Slime",
        stage: "Hardmode",
        image: getFandomImg("Queen_Slime.png"),
        biome: "The Hallow",
        summon: "Gelatin Crystal (mined in Underground Hallow)",
        hp: "18,000 (Classic) / 28,800 (Expert)",
        drops: "Crystal Assassin Armor, Gelatinous Pillion, Volatile Gelatin (Expert)",
        notes: "Grows wings and flies during Phase 2, firing crystal projectiles."
      },
      {

        stage: "Hardmode",

        summon: "Mechanical Eye (3 Lens + 5 Copper/Tin + 6 Soul of Light)",

      },
      {

        image: getFandomImg("Skeletron_Prime.png"),
        biome: "Surface (Night)",
        summon: "Mechanical Skull (30 Bone + 5 Iron/Lead + 3 Soul of Light + 3 Soul of Night)",

        drops: "Hallowed Bar, Soul of Fright, Mechanical Battery Piece (Expert)",

      },
      {

        image: getFandomImg("Plantera.png"),

        hp: "30,000 (Classic) / 42,000 (Expert)",

      {

        biome: "Jungle Temple",
        summon: "Insert a Lihzahrd Power Cell into a Lihzahrd Altar",

      {

        notes: "Fighting her during the day will cause her to one-hit kill the player instantly."
      },
      {
        name: "Duke Fishron",
        stage: "Hardmode",
        image: getFandomImg("Duke_Fishron.png"),
        biome: "Ocean",
        summon: "Fish in the Ocean using a Truffle Worm as bait",
        hp: "60,000 (Classic) / 78,000 (Expert)",
        drops: "Tsunami, Flairon, Razorblade Typhoon, Shrimpy Truffle (Expert)",
        notes: "Extremely fast boss. High mobility is essential."
      },
      {
        name: "Lunatic Cultist",
        stage: "Hardmode",
        image: getFandomImg("Lunatic_Cultist.png"),
        biome: "Dungeon Entrance",
        summon: "Kill the 4 cultists at the Dungeon Entrance after Golem is defeated",
        hp: "32,000 (Classic) / 48,000 (Expert)",
        drops: "Ancient Manipulator",
        notes: "Defeating him initiates the Celestial Events."
      },
      {
        name: "Moon Lord",
        stage: "Hardmode",
        image: getFandomImg("Moon_Lord.png"),
        biome: "Anywhere",
        summon: "Destroy all 4 Celestial Pillars or use a Celestial Sigil",
        hp: "145,000 total (Classic) / 217,500 (Expert)",
        drops: "Meowmere, Star Wrath, Luminite Ore, Portal Gun, Gravity Globe (Expert)",
        notes: "The final boss of Terraria."
      },

      // --- EVENT BOSSES ---
      {
        name: "Dark Mage",
        stage: "Event Boss",
        image: getFandomImg("Dark_Mage.png"),
        biome: "Old One's Army",
        summon: "Eternia Crystal Stand + Eternia Crystal (Pre-Hardmode Tier 1)",
        hp: "800 - 3,200",
        drops: "Defender Medals, War Table, Dragon Egg",
        notes: "Summons skeletons and heals nearby enemy units."
      },
      {
        name: "Ogre",
        stage: "Event Boss",
        image: getFandomImg("Ogre.png"),
        biome: "Old One's Army",
        summon: "Eternia Crystal Stand (Tier 2 after defeating 1 Mech Boss)",
        hp: "10,000 - 24,000",
        drops: "Defender Medals, Brand of the Red Dragon, Tome of Infinite Wisdom",
        notes: "Slow-moving miniboss that deals heavy melee and ranged splash damage."
      },
      {
        name: "Betsy",
        stage: "Event Boss",
        image: getFandomImg("Betsy.png"),
        biome: "Old One's Army",
        summon: "Eternia Crystal Stand (Tier 3 after Golem)",
        hp: "50,000 - 75,000",
        drops: "Betsy's Wrath, Aerial Bane, Sky Dragon's Fury",
        notes: "A flying dragon boss with wide-range fire breath and dash attacks."
      },
      {
        name: "Flying Dutchman",
        stage: "Event Boss",
        image: getFandomImg("Flying_Dutchman.png"),
        biome: "Pirate Invasion",
        summon: "Pirate Map or random Pirate Invasion event in Hardmode",
        hp: "8,000 (4 Cannons)",
        drops: "Coin Gun, Discount Card, Lucky Coin, Flying Dragon",
        notes: "Flying pirate ship. Destroy all 4 cannons on its hull."
      },
      {
        name: "Mourning Wood",
        stage: "Event Boss",
        image: getFandomImg("Mourning_Wood.png"),
        biome: "Pumpkin Moon",
        summon: "Pumpkin Moon Medallion at night",
        hp: "12,000 - 19,200",
        drops: "Spooky Wood, Necromantic Scroll, Witch's Broom",
        notes: "Shoots flaming projectiles through solid tiles."
      },
      {
        name: "Pumpking",
        stage: "Event Boss",
        image: getFandomImg("Pumpking.png"),
        biome: "Pumpkin Moon",
        summon: "Pumpkin Moon Medallion at night (higher event waves)",
        hp: "22,000 - 33,000",
        drops: "The Horseman's Blade, Bat Scepter, Black Fairy Dust",
        notes: "Primary boss of the Pumpkin Moon event."
      },
      {
        name: "Everscream",
        stage: "Event Boss",
        image: getFandomImg("Everscream.png"),
        biome: "Frost Moon",
        summon: "Naughty Present at night",
        hp: "13,000 - 20,800",
        drops: "Razorpine, Christmas Tree Sword, Festive Wings",
        notes: "Fires pine needles and bouncing ornament explosives."
      },
      {
        name: "Santa-NK1",
        stage: "Event Boss",
        image: getFandomImg("Santa-NK1.png"),
        biome: "Frost Moon",
        summon: "Naughty Present at night (mid-tier waves)",
        hp: "18,000 - 28,800",
        drops: "Elf Melter, Chain Gun",
        notes: "Mechanical Santa tank with a minigun and rocket launcher."
      },
      {
        name: "Ice Queen",
        stage: "Event Boss",
        image: getFandomImg("Ice_Queen.png"),
        biome: "Frost Moon",
        summon: "Naughty Present at night (advanced waves)",
        hp: "34,000 - 54,400",
        drops: "Blizzard Staff, Snowman Cannon, Baby Grinch's Mischief Whistle",
        notes: "Fast-flying boss focusing on frost projectile waves."
      },
      {
        name: "Martian Saucer",
        stage: "Event Boss",
        image: getFandomImg("Martian_Saucer.png"),
        biome: "Martian Madness",
        summon: "Get detected by a Martian Probe on the Surface/Space after Golem",
        hp: "27,000 - 40,500",
        drops: "Influx Waver, Cosmic Car Key, Laser Drill, Xenopopper",
        notes: "UFO miniboss with a deadly Deathray laser."
      }
    ];

    const bossList = document.getElementById('bossList');
    const searchInput = document.getElementById('searchInput');
    const stageFilter = document.getElementById('stageFilter');

    function toggleBoss(index) {
      const details = document.getElementById(`details-${index}`);
      const chevron = document.getElementById(`chevron-${index}`);
      details.classList.toggle('hidden');
      chevron.classList.toggle('rotate-180');
    }

    function renderBosses() {
      const search = searchInput.value.toLowerCase();
      const stage = stageFilter.value;

      const filtered = bosses.filter(b => {
        const matchesSearch = b.name.toLowerCase().includes(search) || 
                              b.summon.toLowerCase().includes(search) || 
                              b.biome.toLowerCase().includes(search);
        const matchesStage = stage === 'all' || b.stage === stage;
        return matchesSearch && matchesStage;
      });

      if (filtered.length === 0) {
        bossList.innerHTML = `<p class="text-center text-gray-400 py-8">No bosses found matching your search.</p>`;
        return;
      }

      bossList.innerHTML = filtered.map((b, index) => `
        <div class="bg-gray-800 border border-gray-700 rounded-xl overflow-hidden shadow-md transition hover:border-gray-600">
          <!-- Clickable Header -->
          <button onclick="toggleBoss(${index})" class="w-full text-left p-4 flex justify-between items-center hover:bg-gray-750 transition focus:outline-none gap-3">
            <div class="truncate">
              <h2 class="text-lg sm:text-xl font-bold text-green-400 truncate">${b.name}</h2>
              <span class="text-xs text-gray-400 font-medium truncate block">📍 ${b.biome}</span>
            </div>
            <div class="flex items-center gap-2 sm:gap-3 flex-shrink-0">
              <span class="text-xs px-2.5 py-1 bg-gray-700 text-gray-300 rounded-full font-semibold whitespace-nowrap">${b.stage}</span>
              <svg id="chevron-${index}" class="w-5 h-5 text-gray-400 transform transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
            </div>
          </button>

          <!-- Collapsible Details -->
          <div id="details-${index}" class="hidden p-4 pt-0 border-t border-gray-700/50 mt-1">
            <!-- Boss Image in Dropdown -->
            <div class="flex justify-center my-3 bg-gray-900/80 p-4 rounded-lg border border-gray-800 min-h-[120px] items-center">
              <img src="${b.image}" 
                   alt="${b.name}" 
                   referrerpolicy="no-referrer"
                   class="max-h-36 max-w-full object-contain" 
                   style="image-rendering: pixelated;" 
                   loading="lazy">
            </div>

            <div class="bg-gray-900 p-3 rounded-lg mb-3 border border-gray-800">
              <p class="text-sm text-yellow-400 font-semibold mb-1">🔮 How to Summon:</p>
              <p class="text-xs text-gray-300 leading-relaxed">${b.summon}</p>
            </div>

            <div class="text-xs text-gray-300 space-y-1.5 mb-3">
              <p>❤️ <strong class="text-gray-200">Health (HP):</strong> ${b.hp}</p>
              <p>🎁 <strong class="text-gray-200">Key Drops:</strong> ${b.drops}</p>
            </div>

            <div class="pt-2 border-t border-gray-700/50">
              <p class="text-xs italic text-gray-400">💡 ${b.notes}</p>
            </div>
          </div>
        </div>
      `).join('');
    }

    searchInput.addEventListener('input', renderBosses);
    stageFilter.addEventListener('change', renderBosses);

    renderBosses();
  </script>
</body>
</html>
