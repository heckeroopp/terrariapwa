<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terraria Boss Guide</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1f2937">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen pb-10">

  <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-10 px-4 py-4 shadow-lg">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <h1 class="text-2xl font-bold text-green-400 flex items-center gap-2">
        🌳 Terraria Boss Guide
      </h1>
      <button id="installBtn" class="hidden bg-green-600 hover:bg-green-500 text-white font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2">
        📲 Uložit na plochu
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6">
    <div class="flex flex-col md:flex-row gap-4 mb-6">
      <input type="text" id="searchInput" placeholder="Hledat bosse, biom nebo item pro vyvolání..." 
             class="flex-1 bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:border-green-500">
      
      <select id="stageFilter" class="bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:border-green-500">
        <option value="all">Všechny kategorie</option>
        <option value="Pre-Hardmode">Pre-Hardmode</option>
        <option value="Hardmode">Hardmode</option>
        <option value="Event Boss">Event Bosses</option>
      </select>
    </div>

    <div id="bossList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.remove('hidden');
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.classList.add('hidden');
      }
      deferredPrompt = null;
    });

    const bosses = [

        name: "King Slime",

        drops: "Solidifier, Slime Hook, Ninja Gear díly, Royal Gel (Expert)",
        notes: "Jednoduchý úvodní boss. Stavba plošin nad zemí usnadní boj."

      {
        name: "Eye of Cthulhu",

        drops: "Demonite / Crimtane Ore, Corrupt / Crimson Seeds, Shield of Cthulhu (Expert)",
        notes: "V 2. fázi odhalí tlamu a zrychlí výpady."
      },
      {
        name: "Eater of Worlds",

        biome: "The Corruption",
        summon: "Worm Food (30 Vile Powder + 15 Rotten Chunk) nebo zničení 3 Shadow Orbů",
        hp: "10,050 celkem (Classic) / 15,120 (Expert)",
        drops: "Demonite Ore, Shadow Scale, Worm Scarf (Expert)",
        notes: "Skládá se ze článků. Nejúčinnější jsou prosekávací zbraně (Piercing)."
      },
      {
        name: "Brain of Cthulhu",

        biome: "The Crimson",

      {

      },

      {

        summon: "Zničení 4 Celestial Pillars nebo použitím Celestial Sigil",
        hp: "145,000 celkem (Classic) / 217,500 (Expert)",
        drops: "Meowmere, Star Wrath, Luminite Ore, Portal Gun, Gravity Globe (Expert)",

      },
      {

        hp: "800 - 3,200",
        drops: "Defender Medals, War Table, Dragon Egg",
        notes: "Vyvolává kostlivce a léčí okolní jednotky."
      },
      {
        name: "Ogre",

        biome: "Old One's Army",

        hp: "10,000 - 24,000",
        drops: "Defender Medals, Brand of the Red Dragon, Tome of Infinite Wisdom",
        notes: "Pomalý, ale udílí masivní poškození na blízko i dálku."
      },
      {
        name: "Betsy",
        stage: "Event Boss",
        biome: "Old One's Army",
        summon: "Eternia Crystal Stand (Tier 3 po Golemovi)",
        hp: "50,000 - 75,000",
        drops: "Betsy's Wrath, Aerial Bane, Sky Dragon's Fury",
        notes: "Létající drak, útočí ohnivým dechem v širokém úhlu."
      },
      {
        name: "Flying Dutchman",

        biome: "Pirate Invasion",

      },
      {

      {

        biome: "Pumpkin Moon",

      },
      {

        summon: "Naughty Present v noci (střední vlny)",
        hp: "18,000 - 28,800",
        drops: "Elf Melter, Chain Gun",
        notes: "Mechanický Mikołaj s kulometem a raketometem."
      },
      {
        name: "Ice Queen",
        stage: "Event Boss",
        biome: "Frost Moon",
        summon: "Naughty Present v noci (pokročilé vlny)",
        hp: "34,000 - 54,400",
        drops: "Blizzard Staff, Snowman Cannon, Baby Grinch's Mischief Whistle",
        notes: "Rychle létající boss zaměřující se na ledové útoky z výšky."
      },
      {
        name: "Martian Saucer",
        stage: "Event Boss",
        biome: "Martian Madness",
        summon: "Být odhalen Martian Probe na povrchu / ve vesmíru po Golemovi",
        hp: "27,000 - 40,500",
        drops: "Influx Waver, Cosmic Car Key, Laser Drill, Xenopopper",
        notes: "UFO s 2 fázemi. V 2. fázi střílí nebezpečný smrtící paprsek (Deathray)."
      }
    ];

    const bossList = document.getElementById('bossList');
    const searchInput = document.getElementById('searchInput');
    const stageFilter = document.getElementById('stageFilter');

    function renderBosses() {
      const search = searchInput.value.toLowerCase();
      const stage = stageFilter.value;

      const filtered = bosses.filter(b => {
        const matchesSearch = b.name.toLowerCase().includes(search) || 
                              b.summon.toLowerCase().includes(search) || 
                              b.biome.toLowerCase().includes(search);
        const matchesStage = stage === 'all' || b.stage === stage;
        return matchesSearch && matchesStage;
      });

      bossList.innerHTML = filtered.map(b => `
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-5 shadow-md flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-start mb-2">
              <h2 class="text-xl font-bold text-green-400">${b.name}</h2>
              <span class="text-xs px-2 py-1 bg-gray-700 text-gray-300 rounded font-semibold">${b.stage}</span>
            </div>
            
            <p class="text-sm text-gray-400 mb-3">📍 <strong>Biom:</strong> ${b.biome}</p>
            
            <div class="bg-gray-900 p-3 rounded-lg mb-3 border border-gray-800">
              <p class="text-sm text-yellow-400 font-semibold mb-1">🔮 Vyvolání (Summon):</p>
              <p class="text-xs text-gray-300">${b.summon}</p>
            </div>

            <div class="text-xs text-gray-300 space-y-1 mb-3">
              <p>❤️ <strong>Zdraví (HP):</strong> ${b.hp}</p>
              <p>🎁 <strong>Dropy:</strong> ${b.drops}</p>
            </div>
          </div>

          <div class="pt-2 border-t border-gray-700 mt-2">
            <p class="text-xs italic text-gray-400">💡 ${b.notes}</p>
          </div>
        </div>
      `).join('');
    }

    searchInput.addEventListener('input', renderBosses);
    stageFilter.addEventListener('change', renderBosses);

    renderBosses();
  </script>
</body>
</html>
