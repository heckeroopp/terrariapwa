<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terraria Boss Guide</title>

  <!-- KLÍČOVÝ ŘÁDEK: Blokuje odkazování původního webu, aby wiki neblokovala obrázky -->
  <meta name="referrer" content="no-referrer">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1f2937">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen pb-10">

  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-10 px-4 py-4 shadow-lg">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <h1 class="text-2xl font-bold text-green-400 flex items-center gap-2">
        🌳 Terraria Boss Guide
      </h1>
      <button id="installBtn" class="hidden bg-green-600 hover:bg-green-500 text-white font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2">
        📲 Uložit na plochu
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 mt-6">
    <!-- Search & Filters -->
    <div class="flex flex-col md:flex-row gap-4 mb-6">
      <input type="text" id="searchInput" placeholder="Hledat bosse, biom nebo předmět..." 
             class="flex-1 bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:border-green-500">
      
      <select id="stageFilter" class="bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:border-green-500">
        <option value="all">Všechny kategorie</option>
        <option value="Pre-Hardmode">Pre-Hardmode</option>
        <option value="Hardmode">Hardmode</option>
        <option value="Event Boss">Event Bosses</option>
      </select>
    </div>

    <!-- Boss List -->
    <div id="bossList" class="flex flex-col gap-3"></div>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.remove('hidden');
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.classList.add('hidden');
      }
      deferredPrompt = null;
    });

    // Odkaz přímo na oficiální Terraria Wiki (wiki.gg)
    const getWikiImg = (filename) => `https://terraria.wiki.gg/wiki/Special:FilePath/${filename}`;

    const bosses = [
      // --- PRE-HARDMODE ---
      {
        name: "King Slime",
        stage: "Pre-Hardmode",
        image: getWikiImg("King_Slime.gif"),
        biome: "Surface / Forest",
        summon: "Slime Crown (20 Gel + Gold/Platinum Crown u Altaru) nebo během akce Slime Rain",
        hp: "2,000 (Classic) / 2,800 (Expert) / 3,570 (Master)",
        drops: "Solidifier, Slime Hook, Ninja Gear díly, Royal Gel (Expert)",
        notes: "Volitelný první boss. Postavení plošiny ve výšce z něj udělá velmi snadný souboj."
      },
      {
        name: "Eye of Cthulhu",
        stage: "Pre-Hardmode",
        image: getWikiImg("Eye_of_Cthulhu.gif"),
        biome: "Surface (Night)",
        summon: "Suspicious Looking Eye (6 Lenses u Altaru) nebo 33% šance každou noc (pokud máte HP > 200)",
        hp: "2,800 (Classic) / 3,640 (Expert) / 4,641 (Master)",
        drops: "Demonite / Crimtane Ore, Corrupt / Crimson Seeds, Shield of Cthulhu (Expert)",
        notes: "Při poklesu pod 50 % HP se promění v 2. fázi bez zornice a začne rychle útočit."
      },
      {
        name: "Eater of Worlds",
        stage: "Pre-Hardmode",
        image: getWikiImg("Eater_of_Worlds.gif"),
        biome: "The Corruption",
        summon: "Worm Food (30 Vile Powder + 15 Rotten Chunk) nebo zničení 3 Shadow Orbs",
        hp: "10,050 celkově (Classic) / 15,120 (Expert)",
        drops: "Demonite Ore, Shadow Scale, Worm Scarf (Expert)",
        notes: "Červ složený z více částí. Nejlépe na něj platí zbraně s průrazem (piercing)."
      },
      {
        name: "Brain of Cthulhu",
        stage: "Pre-Hardmode",
        image: getWikiImg("Brain_of_Cthulhu.gif"),
        biome: "The Crimson",
        summon: "Bloody Spine (30 Vicious Powder + 15 Vertebrae) nebo zničení 3 Crimson Hearts",
        hp: "1,250 (Classic) / 2,125 (Expert)",
        drops: "Crimtane Ore, Tissue Sample, Brain of Confusion (Expert)",
        notes: "1. fáze vyžaduje zničení létajících Creepers. 2. fáze vytváří iluze a teleportuje se."
      },
      {
        name: "Queen Bee",
        stage: "Pre-Hardmode",
        image: getWikiImg("Queen_Bee.gif"),
        biome: "Underground Jungle",
        summon: "Abeemination nebo rozbití Larvy v včelím úlu (Bee Hive)",
        hp: "3,400 (Classic) / 4,760 (Expert)",
        drops: "Bee Gun, Bee Keeper, Hive Pack (Expert)",
        notes: "Střídá horizontální nálety a vyvolávání malých včel."
      },
      {
        name: "Skeletron",
        stage: "Pre-Hardmode",
        image: getWikiImg("Skeletron.gif"),
        biome: "Dungeon Entrance",
        summon: "Promluvte s Old Manem u vchodu do Dungeonu v noci",
        hp: "4,400 (Classic) / 8,800 (Expert)",
        drops: "Skeletron Hand, Book of Skulls, Bone Glove (Expert)",
        notes: "Poražení Skeletrona zpřístupní bezpečný vstup do celého Dungeonu."
      },
      {
        name: "Deerclops",
        stage: "Pre-Hardmode",
        image: getWikiImg("Deerclops.gif"),
        biome: "Snow Biome (Midnight / Blizzard)",
        summon: "Deer Thing (1 Flinx Fur + 5 Demonite/Crimtane Ore + 1 Lens)",
        hp: "7,000 (Classic) / 11,900 (Expert)",
        drops: "Eye Bone, Lucy the Axe, Bone Helm (Expert)",
        notes: "Crossover boss ze hry Don't Starve Together."
      },
      {
        name: "Wall of Flesh",
        stage: "Pre-Hardmode",
        image: getWikiImg("Wall_of_Flesh.gif"),
        biome: "Underworld",
        summon: "Hozte Guide Voodoo Doll do lávy v Underworldu, dokud žije Guide",
        hp: "8,000 (Classic) / 11,200 (Expert)",
        drops: "Pwnhammer, Class Emblem, Demon Heart (Expert)",
        notes: "Poražením tohoto bosse trvale přepnete svět do režimu Hardmode."
      },

      // --- HARDMODE ---
      {
        name: "Queen Slime",

        image: getWikiImg("Queen_Slime.gif"),

        drops: "Hallowed Bar, Soul of Might, Mechanical Wagon Piece (Expert)",
        notes: "Obří mechanický červ. Při poškození částí vypouští útočné sondy."
      },
      {
        name: "Skeletron Prime",
        stage: "Hardmode",
        image: getWikiImg("Skeletron_Prime.gif"),
        biome: "Surface (Night)",
        summon: "Mechanical Skull (30 Bone + 5 Iron/Lead + 3 Soul of Light + 3 Soul of Night)",
        hp: "28,000 (Classic) / 42,000 (Expert)",

      },
      {

        stage: "Hardmode",

      },
      {
        name: "Golem",
        stage: "Hardmode",
        image: getWikiImg("Golem.gif"),
        biome: "Jungle Temple",
        summon: "Vložte Lihzahrd Power Cell do Lihzahrd Altaru",
        hp: "60,000 (Classic) / 90,000 (Expert)",
        drops: "Picksaw, Stynger, Sun Stone, Shiny Stone (Expert)",
        notes: "Bojuje se s ním uvnitř chrámu v džungli."
      },
      {
        name: "Empress of Light",
        stage: "Hardmode",
        image: getWikiImg("Empress_of_Light.gif"),
        biome: "The Hallow (Night / Day)",
        summon: "Zabijte Prismatic Lacewing v biomu Hallow",
        hp: "70,000 (Classic) / 98,000 (Expert)",
        drops: "Terraprism (při zabití ve dne), Eventide, Soaring Insignia (Expert)",
        notes: "Pokud s ní bojujete přes den, jakýkoliv její zásah vás okamžitě zabije."
      },
      {
        name: "Duke Fishron",
        stage: "Hardmode",
        image: getWikiImg("Duke_Fishron.gif"),
        biome: "Ocean",
        summon: "Chytat ryby v oceánu s návnadou Truffle Worm",
        hp: "60,000 (Classic) / 78,000 (Expert)",
        drops: "Tsunami, Flairon, Razorblade Typhoon, Shrimpy Truffle (Expert)",
        notes: "Extrémně rychlý boss, je nutná vysoká mobilita."
      },
      {
        name: "Lunatic Cultist",
        stage: "Hardmode",
        image: getWikiImg("Lunatic_Cultist.gif"),
        biome: "Dungeon Entrance",
        summon: "Zabijte 4 kultisty u vchodu do Dungeonu po poražení Golema",
        hp: "32,000 (Classic) / 48,000 (Expert)",
        drops: "Ancient Manipulator",
        notes: "Jeho poražením odstartujete Celestial Events (vesmírné pilíře)."
      },
      {
        name: "Moon Lord",
        stage: "Hardmode",
        image: getWikiImg("Moon_Lord.gif"),
        biome: "Kdekoliv",
        summon: "Zničte všechny 4 Celestial Pillars nebo použijte Celestial Sigil",
        hp: "145,000 celkově (Classic) / 217,500 (Expert)",
        drops: "Meowmere, Star Wrath, Luminite Ore, Portal Gun, Gravity Globe (Expert)",
        notes: "Finální boss hry Terraria."
      },

      // --- EVENT BOSSES ---
      {
        name: "Dark Mage",
        stage: "Event Boss",
        image: getWikiImg("Dark_Mage.gif"),
        biome: "Old One's Army",
        summon: "Eternia Crystal Stand + Eternia Crystal (Pre-Hardmode Tier 1)",
        hp: "800 - 3,200",
        drops: "Defender Medals, War Table, Dragon Egg",
        notes: "Vyvolává kostlivce a léčí okolní jednotky."
      },
      {
        name: "Ogre",
        stage: "Event Boss",
        image: getWikiImg("Ogre.gif"),
        biome: "Old One's Army",
        summon: "Eternia Crystal Stand (Tier 2 po poražení 1 Mech Bosse)",
        hp: "10,000 - 24,000",
        drops: "Defender Medals, Brand of the Red Dragon, Tome of Infinite Wisdom",
        notes: "Pomalý miniboss udělující vysoké plošné poškození."
      },
      {
        name: "Betsy",
        stage: "Event Boss",
        image: getWikiImg("Betsy.gif"),
        biome: "Old One's Army",
        summon: "Eternia Crystal Stand (Tier 3 po poražení Golema)",
        hp: "50,000 - 75,000",
        drops: "Betsy's Wrath, Aerial Bane, Sky Dragon's Fury",
        notes: "Létající dračí boss s dýcháním ohně."
      },
      {
        name: "Flying Dutchman",
        stage: "Event Boss",
        image: getWikiImg("Flying_Dutchman.gif"),
        biome: "Pirate Invasion",
        summon: "Pirate Map nebo náhodná událost Pirate Invasion",
        hp: "8,000 (4 děla)",
        drops: "Coin Gun, Discount Card, Lucky Coin, Flying Dragon",
        notes: "Létající pirátská loď. Je potřeba zničit všechna 4 děla na trupu."
      },
      {
        name: "Mourning Wood",
        stage: "Event Boss",
        image: getWikiImg("Mourning_Wood.gif"),
        biome: "Pumpkin Moon",
        summon: "Pumpkin Moon Medallion v noci",
        hp: "12,000 - 19,200",
        drops: "Spooky Wood, Necromantic Scroll, Witch's Broom",
        notes: "Střílí hořící projektily skrz pevné bloky."
      },
      {
        name: "Pumpking",
        stage: "Event Boss",
        image: getWikiImg("Pumpking.gif"),
        biome: "Pumpkin Moon",
        summon: "Pumpkin Moon Medallion v noci (vyšší vlny)",
        hp: "22,000 - 33,000",
        drops: "The Horseman's Blade, Bat Scepter, Black Fairy Dust",
        notes: "Hlavní boss události Pumpkin Moon."
      },
      {
        name: "Everscream",
        stage: "Event Boss",
        image: getWikiImg("Everscream.gif"),
        biome: "Frost Moon",
        summon: "Naughty Present v noci",
        hp: "13,000 - 20,800",
        drops: "Razorpine, Christmas Tree Sword, Festive Wings",
        notes: "Střílí jehličí a výbušné vánoční ozdoby."
      },
      {
        name: "Santa-NK1",
        stage: "Event Boss",
        image: getWikiImg("Santa-NK1.gif"),
        biome: "Frost Moon",
        summon: "Naughty Present v noci (pokročilé vlny)",
        hp: "18,000 - 28,800",
        drops: "Elf Melter, Chain Gun",
        notes: "Mechanický Santa tank s kulometem a raketometem."
      },
      {
        name: "Ice Queen",
        stage: "Event Boss",
        image: getWikiImg("Ice_Queen.gif"),
        biome: "Frost Moon",
        summon: "Naughty Present v noci (nejvyšší vlny)",
        hp: "34,000 - 54,400",
        drops: "Blizzard Staff, Snowman Cannon, Baby Grinch's Mischief Whistle",
        notes: "Rychle létající boss vrhající ledové vlny."
      },
      {
        name: "Martian Saucer",
        stage: "Event Boss",
        image: getWikiImg("Martian_Saucer.gif"),
        biome: "Martian Madness",
        summon: "Být odhalen Martian Probe na povrchu/vesmíru po Golemovi",
        hp: "27,000 - 40,500",
        drops: "Influx Waver, Cosmic Car Key, Laser Drill, Xenopopper",
        notes: "UFO miniboss se smrtícím laserovým paprskem (Deathray)."
      }
    ];

    const bossList = document.getElementById('bossList');
    const searchInput = document.getElementById('searchInput');
    const stageFilter = document.getElementById('stageFilter');

    function toggleBoss(index) {
      const details = document.getElementById(`details-${index}`);
      const chevron = document.getElementById(`chevron-${index}`);
      details.classList.toggle('hidden');
      chevron.classList.toggle('rotate-180');
    }

    function renderBosses() {
      const search = searchInput.value.toLowerCase();
      const stage = stageFilter.value;

      const filtered = bosses.filter(b => {
        const matchesSearch = b.name.toLowerCase().includes(search) || 
                              b.summon.toLowerCase().includes(search) || 
                              b.biome.toLowerCase().includes(search);
        const matchesStage = stage === 'all' || b.stage === stage;
        return matchesSearch && matchesStage;
      });

      if (filtered.length === 0) {
        bossList.innerHTML = `<p class="text-center text-gray-400 py-8">Žádný boss neodpovídá vyhledávání.</p>`;
        return;
      }

      bossList.innerHTML = filtered.map((b, index) => `
        <div class="bg-gray-800 border border-gray-700 rounded-xl overflow-hidden shadow-md transition hover:border-gray-600">
          <button onclick="toggleBoss(${index})" class="w-full text-left p-4 flex justify-between items-center hover:bg-gray-750 transition focus:outline-none gap-3">
            <div class="truncate">
              <h2 class="text-lg sm:text-xl font-bold text-green-400 truncate">${b.name}</h2>
              <span class="text-xs text-gray-400 font-medium truncate block">📍 ${b.biome}</span>
            </div>
            <div class="flex items-center gap-2 sm:gap-3 flex-shrink-0">
              <span class="text-xs px-2.5 py-1 bg-gray-700 text-gray-300 rounded-full font-semibold whitespace-nowrap">${b.stage}</span>
              <svg id="chevron-${index}" class="w-5 h-5 text-gray-400 transform transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
            </div>
          </button>

          <div id="details-${index}" class="hidden p-4 pt-0 border-t border-gray-700/50 mt-1">
            <!-- Obrázek s pravidlem referrerpolicy="no-referrer" -->
            <div class="flex justify-center my-3 bg-gray-900/80 p-4 rounded-lg border border-gray-800 min-h-[120px] items-center">
              <img src="${b.image}" 
                   alt="${b.name}" 
                   referrerpolicy="no-referrer"
                   class="max-h-36 max-w-full object-contain" 
                   style="image-rendering: pixelated;" 
                   loading="lazy"
                   onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'text-center text-gray-500 py-2\'><span class=\'text-3xl\'>👾</span><br><span class=\'text-xs\'>Obrázek se nepodařilo načíst</span></div>';">
            </div>

            <div class="bg-gray-900 p-3 rounded-lg mb-3 border border-gray-800">
              <p class="text-sm text-yellow-400 font-semibold mb-1">🔮 Jak vyvolat:</p>
              <p class="text-xs text-gray-300 leading-relaxed">${b.summon}</p>
            </div>

            <div class="text-xs text-gray-300 space-y-1.5 mb-3">
              <p>❤️ <strong class="text-gray-200">Životy (HP):</strong> ${b.hp}</p>
              <p>🎁 <strong class="text-gray-200">Hlavní dropy:</strong> ${b.drops}</p>
            </div>

            <div class="pt-2 border-t border-gray-700/50">
              <p class="text-xs italic text-gray-400">💡 ${b.notes}</p>
            </div>
          </div>
        </div>
      `).join('');
    }

    searchInput.addEventListener('input', renderBosses);
    stageFilter.addEventListener('change', renderBosses);

    renderBosses();
  </script>
</body>
</html>
